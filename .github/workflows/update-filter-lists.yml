name: Update filter lists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions: {}

concurrency:
  group: production-filter-list-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      deployed-manifest: ${{ steps.publication.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the pinned Safari rule converter
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/SafariConverterLib.tar.gz" \
            https://github.com/AdguardTeam/SafariConverterLib/archive/refs/tags/v4.3.0.tar.gz
          tar -xzf "$RUNNER_TEMP/SafariConverterLib.tar.gz" -C "$RUNNER_TEMP"
          swift build \
            --package-path "$RUNNER_TEMP/SafariConverterLib-4.3.0" \
            --configuration release \
            --product ConverterTool
          echo "CONVERTER_TOOL_PATH=$RUNNER_TEMP/SafariConverterLib-4.3.0/.build/release/ConverterTool" >> "$GITHUB_ENV"

      - name: Download, convert and sign the current lists
        env:
          FILTER_LIST_SIGNING_PRIVATE_KEY: ${{ secrets.FILTER_LIST_SIGNING_PRIVATE_KEY }}
        run: scripts/update-lists.sh

      - run: node scripts/verify-manifest.mjs

      - name: Prepare the publication checkpoint
        id: publication
        shell: bash
        run: |
          echo "manifest=$(base64 < assets/v1/manifest.json | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - run: npm test
      - run: npm run check

      - name: Deploy Worker and generated assets
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  record-publication:
    name: Record publication checkpoint
    needs: update-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Determine whether a checkpoint is due
        id: cadence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(date -u +%d)" == "01" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.cadence.outputs.due == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore the deployed manifest
        if: steps.cadence.outputs.due == 'true'
        shell: bash
        env:
          MANIFEST_BASE64: ${{ needs.update-and-deploy.outputs.deployed-manifest }}
        run: |
          if [[ -z "$MANIFEST_BASE64" ]]; then
            echo "The deployment job did not provide a manifest." >&2
            exit 1
          fi
          printf '%s' "$MANIFEST_BASE64" | base64 --decode > "$RUNNER_TEMP/manifest.json"

      - name: Verify and write the publication checkpoint
        if: steps.cadence.outputs.due == 'true'
        run: |
          node scripts/create-publication-checkpoint.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --output state/latest-publication.json

      - name: Commit the publication checkpoint
        if: steps.cadence.outputs.due == 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- state/latest-publication.json)" ]]; then
            echo "The publication checkpoint is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest-publication.json
          git commit -m "Record filter-list publication checkpoint"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
